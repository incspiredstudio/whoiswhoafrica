# Weekly vulnerability scan of the locked dependencies, plus on demand. A finding fails the run, which notifies the repo watchers.
name: Weekly security scan
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", tools: composer }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: PHP dependencies
        run: composer audit --locked
      - name: JavaScript dependencies
        run: npm audit --audit-level=high
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
