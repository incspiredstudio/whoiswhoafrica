# Publishes the clickable wireframe (/prototype) to GitHub Pages. Static files only, no build step.
# One-time setup by a repo admin: Settings > Pages > Source = "GitHub Actions".
name: Publish wireframe
on:
  push:
    branches: [main, chore/structured-build-setup]
    paths: [prototype/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deployment
        uses: actions/deploy-pages@v4
