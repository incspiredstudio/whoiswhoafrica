# Merge gates for the WordPress site (site/). Job names are stable: lint, analyse, test, build, e2e, audit, plugins, secrets, pr-body.
# Required checks for branch protection (set by the repo owner): lint, analyse, test, build, e2e, audit, plugins, secrets, pr-body.
# The visibility job (visibility matrix) also runs on every PR; a plugin or allowlist change needs it green.
# Speed: e2e runs as 4 parallel shards (e2e-shard) and the single required check "e2e" passes only when every shard passed.
# PHPUnit coverage (pcov plus the threshold) runs on push to the default branch; pull requests run the same suites without coverage.
# Deploy is not a CI step: going live is a manual migration (docs/build/deployment.md).
name: CI
on:
  pull_request:
  push:
    branches: [main, chore/structured-build-setup]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ env.PHP_VERSION }}", tools: composer }
      - uses: actions/cache@v4
        with: { path: ~/.cache/composer, key: "composer-${{ hashFiles('site/composer.lock') }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: composer lint
      - run: npm run lint:js
      - run: npm run lint:css

  analyse:
    name: analyse
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ env.PHP_VERSION }}", tools: composer }
      - uses: actions/cache@v4
        with: { path: ~/.cache/composer, key: "composer-${{ hashFiles('site/composer.lock') }}" }
      - run: composer install --no-interaction --prefer-dist
      - run: composer analyse

  test:
    name: test
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wiw_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WIW_TEST_DB_NAME: wiw_test
      WIW_TEST_DB_USER: root
      WIW_TEST_DB_PASSWORD: root
      WIW_TEST_DB_HOST: "127.0.0.1:3306"
      COVERAGE: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ env.PHP_VERSION }}", tools: composer, coverage: "${{ env.COVERAGE == 'true' && 'pcov' || 'none' }}", extensions: "mbstring, mysqli, zip, intl, gd", ini-values: "pcov.directory=." }
      - uses: actions/cache@v4
        with: { path: ~/.cache/composer, key: "composer-${{ hashFiles('site/composer.lock') }}" }
      - run: composer install --no-interaction --prefer-dist
      - name: PHPUnit, all suites (pull requests and other pushes, no coverage)
        if: env.COVERAGE != 'true'
        run: composer test
      - name: PHPUnit, all suites, with the coverage threshold (push to the default branch)
        if: env.COVERAGE == 'true'
        run: composer test:coverage
      - uses: actions/upload-artifact@v4
        if: always() && env.COVERAGE == 'true'
        with: { name: coverage, path: site/build/coverage, if-no-files-found: ignore }

  visibility:
    name: visibility
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wiw_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WIW_TEST_DB_NAME: wiw_test
      WIW_TEST_DB_USER: root
      WIW_TEST_DB_PASSWORD: root
      WIW_TEST_DB_HOST: "127.0.0.1:3306"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ env.PHP_VERSION }}", tools: composer, extensions: "mbstring, mysqli, zip, intl, gd" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/composer, key: "composer-${{ hashFiles('site/composer.lock') }}" }
      - run: composer install --no-interaction --prefer-dist
      - name: Visibility matrix (every surface, every publication state); rerun after any plugin, guard or theme change
        run: composer test -- --testsuite Visibility

  build:
    name: build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run build

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults: { run: { working-directory: site } }
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wiw_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      BASE_URL: http://127.0.0.1:8890
      WIW_THEME_READY: "1"
      WIW_NO_WEBKIT: "1"
      WIW_SECRETS_FILE: ${{ github.workspace }}/wiw-secrets.env
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ env.PHP_VERSION }}", tools: composer, extensions: "mbstring, mysqli, zip, intl, gd" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/composer, key: "composer-${{ hashFiles('site/composer.lock') }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Write a throwaway secrets file outside the web root
        run: |
          {
            echo "WIW_ENV=local"
            echo "WIW_SITE_URL=http://127.0.0.1:8890"
            echo "DB_NAME=wiw_e2e"
            echo "DB_USER=root"
            echo "DB_PASSWORD=root"
            echo "DB_HOST=127.0.0.1:3306"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=1025"
            for k in AUTH_KEY SECURE_AUTH_KEY LOGGED_IN_KEY NONCE_KEY AUTH_SALT SECURE_AUTH_SALT LOGGED_IN_SALT NONCE_SALT; do echo "$k=$(openssl rand -hex 16)"; done
          } > "$WIW_SECRETS_FILE"
      - name: Install WordPress and start the server
        run: |
          php deploy/ci/install-wp.php
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8890 -t . deploy/ci/router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8890/ >/dev/null && break; sleep 1; done
      # System libraries come from apt, which the runners could not reach (2026-11-11), so CI installs Chromium only and skips WebKit.
      # Re-enable with: npx playwright install --with-deps chromium webkit, and remove WIW_NO_WEBKIT, once apt works again.
      - name: Playwright version (browser cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: "ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium" }
      - name: Install Chromium (a no-op when the cache restored it)
        timeout-minutes: 8
        run: npx playwright install chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      # Throttled LCP, CLS and weight check (M0-QAX-05). Non-blocking until the owner agrees the budgets in tests/e2e/perf/budgets.json. Runs once, in shard 1.
      - name: Performance budget (non-blocking)
        continue-on-error: true
        if: matrix.shard == 1
        run: WIW_PERF=1 npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "playwright-report-${{ matrix.shard }}", path: "site/playwright-report\nsite/test-results", if-no-files-found: ignore }

  # The required status check "e2e": passes only when all four shards passed.
  e2e:
    name: e2e
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-24.04
    steps:
      - name: Every e2e shard passed
        env: { RESULT: "${{ needs.e2e-shard.result }}" }
        run: |
          echo "e2e shards: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::One or more e2e shards did not pass ($RESULT)."; exit 1; }

  audit:
    name: audit
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ env.PHP_VERSION }}", tools: composer }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: composer audit --locked
      - run: npm audit --audit-level=high

  plugins:
    name: plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Plugin allowlist and forbidden kinds
        run: |
          node --test scripts/__tests__/check-plugins.test.js
          node scripts/check-plugins.js

  brand:
    name: brand
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Brand values only in the child tokens file and the brand configuration
        run: |
          node --test scripts/__tests__/check-brand-values.test.js
          node scripts/check-brand-values.js
      - name: Traceability report (non-blocking until M5; docs/traceability.md is not rewritten here)
        continue-on-error: true
        run: |
          node --test scripts/__tests__/traceability.test.js
          node scripts/traceability.js --out "$RUNNER_TEMP/traceability.md" --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: traceability, path: "${{ runner.temp }}/traceability.md", if-no-files-found: ignore }

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  pr-body:
    name: pr-body
    runs-on: ubuntu-24.04
    steps:
      - name: PR body cites a REQ id and "Closes #N"
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -Eq 'REQ-[0-9]+' || { echo "::error::The pull request body must cite at least one REQ id (REQ-123)."; exit 1; }
          echo "$BODY" | grep -Eiq '(closes|fixes|resolves) #[0-9]+' || { echo "::error::The pull request body must contain 'Closes #N'."; exit 1; }
      - name: Not applicable (not a pull request, or a Dependabot version bump, which every other gate still checks)
        if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "pr-body applies to pull requests only"
